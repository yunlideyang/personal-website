<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirect to index</title>
  <script>
    (function () {
      var basePath = '/personal-website';
      var l = window.location;
      var pathname = l.pathname || '';
      var relative = pathname.indexOf(basePath) === 0 ? pathname.slice(basePath.length) : pathname;
      if (!relative.startsWith('/')) relative = '/' + relative;
      var target = relative + (l.search || '') + (l.hash || '');
      l.replace(basePath + '/?p=' + encodeURIComponent(target));
    })();
  </script>
</head>
<body></body>
</html>
