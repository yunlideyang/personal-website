<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loading...</title>
  <script>
    // 核心逻辑：把 History 模式的路径重定向到 Hash 模式
    (function() {
      // 你的 GitHub Pages 仓库基础路径
      const basePath = '/personal-website/';
      // 获取当前页面的路径和参数（比如 /home?a=1）
      const fullPath = window.location.pathname + window.location.search;
      
      // 去掉基础路径前缀，避免重复（比如 /personal-website/home → /home）
      const relativePath = fullPath.replace(basePath, '') || '/';
      
      // 重定向到 index.html 的 Hash 路径（适配 React HashRouter）
      window.location.href = basePath + '#/' + relativePath;
    })();
  </script>
</head>
<body></body>
</html>
